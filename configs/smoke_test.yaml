# Smoke Test Configuration for Fast Pipeline Verification
model:
  name: "deit_tiny_patch16_224"
  pretrained: true

dataset:
  name: "synthetic"
  data_dir: "./data"
  num_samples: 10
  batch_size: 5
  seed: 42

experiment:
  seed: 42
  layers: [4, 8]
  retention_ratios: [1.0, 0.5, 0.25]
  scorers:
    - "random"
    - "prediction_kl_approximate"
    - "attention_cls"
  measure_latency: true
  output_dir: "./results/smoke_test"
