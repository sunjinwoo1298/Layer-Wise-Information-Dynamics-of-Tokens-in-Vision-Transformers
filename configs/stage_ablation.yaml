# Phase 2: controlled pruning-stage ablation (evaluation only).
# Layer keys are 1-based (same as Phase 1/2): key l = after l blocks, keep exactly k PATCH tokens (CLS always kept).
model:
  name: "deit_tiny_patch16_224"
  pretrained: true

dataset:
  name: "imagenet_val"
  data_dir: "./data"        # same cached 250-image file as Phase 1 / previous evaluation (order verified at run time)
  num_samples: 250
  batch_size: 25
  seed: 42

ablation:
  seed: 42
  extra_seeds_random: [43, 44]
  budgets: [0.40, 0.50, 0.60, 0.70]   # nominal fractions of unpruned analytic FLOPs
  match_tolerance: 0.01               # +-1 percentage point of baseline FLOPs vs the one-stage anchor (fixed in advance)
  primary_first_layer: 2
  secondary_first_layers: [4]         # separate secondary analysis
  primary_scorer: cls_attention
  scorers_primary_layer: [cls_attention, random, prediction_kl_approx]
  scorers_secondary_layer: [cls_attention, random]
  measure_latency: true
  latency_warmup: 1
  latency_timed_runs: 3
  previous_eval_dir: "./results/phase2_progressive_eval"   # subset manifest is verified against this; run stops on mismatch
  output_dir: "./results/phase2_stage_ablation"

# Pruning-layer structures (first layer fixed per analysis). Counts are generated by the documented FLOPs-matching procedure.
structures:
  2:
    two:   [[2, 4], [2, 6], [2, 8]]
    three: [[2, 4, 8], [2, 6, 10], [2, 8, 10]]
  4:
    two:   [[4, 6], [4, 8], [4, 10]]
    three: [[4, 6, 8], [4, 8, 10], [4, 6, 10]]
